# =============================================================================
#  FULLSCALE MODEL A  --  transcribed from data/designs/Fullscale_Model_A.ork
# =============================================================================
#  Masses, section lengths and part positions come from the worksheet named in
#  `mass_properties:`.  This file holds shapes, the motor, recovery hardware and
#  engineering decisions.  After editing the worksheet, run
#  `python scripts/check_mass_csv.py`.
#
#  Verify against the GUI design with:
#      python scripts/check_against_ork.py \
#          --vehicle config/vehicles/fullscale_model_a.yaml \
#          --ork data/designs/Fullscale_Model_A.ork
#
#  Items marked CONFIRM are NOT in the .ork -- they are engineering decisions
#  nobody has made yet.  See USER_GUIDE section 2.9.
# =============================================================================

name: "Fullscale Model A"
team: "REPLACE-WITH-TEAM-NAME"
season: "2026-2027"
status: "transcribed from data/designs/Fullscale_Model_A.ork; ballast and target unconfirmed"
vehicle_type: full_scale
mass_properties: fullscale_model_a.csv   # in config/mass/

# --- Airframe ---------------------------------------------------------------
airframe:
  outer_diameter_in: 5.15     # .ork aft radius 0.065405 m
  wall_thickness_in: 0.075    # 0.001905 m, both body tubes
  # The .ork has the nose and payload tube POLISHED and the booster NORMAL.  The
  # schema carries one finish for the whole airframe, so this takes the rougher
  # of the two -- being conservative on drag is the right way to be wrong.
  surface_finish: regular_paint

# --- Nose cone --------------------------------------------------------------
nose_cone:
  shape: ellipsoid
  shape_parameter: 1.0        # unused by ellipsoid; kept for schema completeness
  wall_thickness_in: 0.0787   # 0.002 m
  shoulder_length_in: 5.5     # req 2.5.3 needs >= 2.58 in (0.5 body diameter)

# --- Body sections ----------------------------------------------------------
#  Defined in the worksheet.  Two tubes, not three: the avionics bay is a sealed
#  region INSIDE the payload airframe, not a separate tube.

# --- Transitions ------------------------------------------------------------
#  Length, mass and position come from the worksheet's Boattail section.
transitions:
  - name: "Boattail"
    fore_diameter_in: 5.15
    aft_diameter_in: 2.953    # 0.0375 m radius
    shape: ogive
    shape_parameter: 1.0
    wall_thickness_in: 0.0787

# --- Fins -------------------------------------------------------------------
fins:
  count: 4
  root_chord_in: 8.00
  tip_chord_in: 4.00
  sweep_in: 5.20              # 0.13208 m
  height_in: 5.50             # semi-span
  thickness_in: 0.118         # 0.003 m
  cant_deg: 0.0
  offset_from_aft_in: 0.0     # trailing edge is flush with the airframe aft end

# --- Rail buttons -----------------------------------------------------------
rail_guide:
  type: rail_button
  rail_size_in: 1.5           # 1515, two buttons at 57.0 and 62.0 in

# --- Motor ------------------------------------------------------------------
#  The .ork carries four configurations (K1100T, K1103X, K780R, K1800ST-P).
#  This is the default one and the one its saved simulation flew.
#
#  The -P suffix is the plugged variant, which is what req 3.1.3 requires: no
#  motor ejection.  The framework plugs the motor regardless.
motor:
  search: "K1800ST-P"
  manufacturer: "AeroTech"
  mount_inner_diameter_in: 2.96    # 75 mm; .ork inner radius 0.037592 m
  mount_length_in: 16.0
  #  The .ork's motor tube runs 54.0-70.0 in, so it protrudes 1.0 in past the
  #  airframe aft end (69.0 in) into the boattail.  The framework always seats
  #  the mount flush with that aft end, so the tube cannot sit there -- but the
  #  mount's mass is overridden to zero, so only the MOTOR's station affects CG,
  #  and overhang moves the motor aft of the mount by exactly that 1.0 in.
  #  Without this the motor's 6.1 lb sits an inch too far forward and the model
  #  reads 2.27 caliber against the .ork's 2.25 -- margin the vehicle does not
  #  have, on a scored requirement.  With it, 2.23: still 0.02 off, but low
  #  rather than high.  Do not tune this to zero the error; 1.0 in is the
  #  measured geometry, and the remainder is the boattail mass sitting at its
  #  midpoint (the schema carries no CG for a transition) plus rounding.
  overhang_in: 1.0
  ignition_delay_s: 0.0

# --- Recovery ---------------------------------------------------------------
#  Masses and positions come from the worksheet's main, drogue and shock_cord
#  rows; each item's bay is the section its position falls in.
recovery:
  drogue:
    name: "Drogue Parachute"
    diameter_in: 18.0
    cd: 1.5
    deploy_event: apogee
    deploy_delay_s: 0.0       # req 3.1.2 allows up to 2.0 s
  main:
    name: "Main Parachute"
    diameter_in: 84.0
    cd: 2.2
    deploy_event: altitude
    deploy_altitude_ft: 600.0 # 182.88 m; req 3.1.1 needs >= 500 ft

# --- Tethered payload -------------------------------------------------------
#  The worksheet's `tethered` row: the payload rides inside the payload tube on
#  the pad and lands on its own tether.  It moves mass between landing pieces
#  without changing the flight.

# --- Independent sections at landing (req 3.2) ------------------------------
#  Four independent bodies, per the team's recovery architecture.  This is NOT
#  in the .ork and not derivable from it -- which joints separate is a design
#  decision, and it drives the scored kinetic-energy check.
#
#  The nose cone separates carrying its own bulkhead and shock cord (both are in
#  the .ork, inside the nose at 6.88 and 9.99 in).  The payload follows on its
#  own tether, then the payload airframe, then the booster.
#
#  All four hang from one tether chain, so they share a single descent rate --
#  which is exactly how check_kinetic_energy computes it.  What no engine here
#  models is the tether dynamics between them: both treat descent as one point
#  mass under the chute, so differential drag and pendulum motion are out of
#  scope.  Sizing to the shared rate is the conventional reading.
landing_sections:
  - name: "Nose Cone"
    members: ["nose_cone"]
  - name: "Payload"
    members: ["Payload"]
  - name: "Payload Airframe"
    members: ["Payload Airframe"]
  - name: "Booster + Boattail"
    members: ["Booster Airframe", "fins", "Boattail"]

# --- Ballast (req 2.20.7) ---------------------------------------------------
#  CONFIRM -- no ballast is modeled in the .ork, so none is declared here.
#  The 10% ceiling on this vehicle is 1.92 lb of its 19.25 lb un-ballasted mass.
#  Set max_lb once the team decides whether to carry trim mass; until then
#  `--ballast both` runs the same configuration twice.
ballast:
  min_lb: 0.0
  max_lb: 0.0
  location: "Payload Airframe"

# --- Declared target (req 2.3, set at CDR) ----------------------------------
#  CONFIRM -- this is the NOMINAL prediction at Bragg Farms (4,666 ft), not a
#  declaration.  The .ork's own saved simulation reached 5,109 ft, but at sea
#  level with a 0 deg rod angle and 2 m/s wind; 620 ft of site elevation and the
#  real 5 deg rail angle account for the difference.  Requirement 2.3 scores
#  closeness to what you declare at CDR, and the best declaration is the MEDIAN
#  of the dispersed distribution, not a single nominal run:
#      python scripts/run_montecarlo.py -n 1000 --vehicle config/vehicles/fullscale_model_a.yaml
#  Re-declare from that before CDR.
target_apogee_ft: 4670.0
