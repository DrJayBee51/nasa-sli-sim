# =============================================================================
#  FULL-SCALE VEHICLE SPECIFICATION  --  *** PLACEHOLDER TEMPLATE ***
# =============================================================================
#  Every number here and in its worksheet is a REPRESENTATIVE USLI-class value,
#  not a design.  It exists so the framework runs before a real design does,
#  and so a new vehicle file has a complete example to copy.  The layout --
#  nose, payload airframe with a tethered payload, booster, boat tail, four
#  pieces at landing -- matches the 2026-27 architecture; the values do not.
#
#  This file and its worksheet together are the single source of truth: they
#  generate BOTH the OpenRocket .ork and the RocketPy model, so the two tools
#  can never silently drift apart.
#
#  Masses, section lengths and part positions come from the worksheet named in
#  `mass_properties:`.  This file holds shapes, the motor, recovery hardware and
#  engineering decisions.  After editing the worksheet, run
#  `python scripts/check_mass_csv.py`.
#
#  Units are imperial (in / lb / ft) to match the handbook and how the team
#  will think about the vehicle.  Conversion to SI happens in slisim.units.
# =============================================================================

name: "Template Full-Scale"
team: "REPLACE-WITH-TEAM-NAME"
season: "2026-2027"
status: "PLACEHOLDER - not a real design"
vehicle_type: full_scale
mass_properties: full_scale.csv   # in config/mass/

# --- Airframe ---------------------------------------------------------------
airframe:
  outer_diameter_in: 6.00     # 6" is typical when an internal payload needs
                              # volume; 4" scores better on mass (2.21)
  wall_thickness_in: 0.080    # filament-wound fiberglass typical
  surface_finish: regular_paint   # smooth | regular_paint | unfinished | rough

# --- Nose cone --------------------------------------------------------------
#  Length, mass and CG come from the worksheet's Nose Cone section.
nose_cone:
  shape: ogive                # ogive | conical | ellipsoid | haack | parabolic | power
  shape_parameter: 1.0        # 1.0 = tangent ogive; for haack 0.0 = Von Karman
  wall_thickness_in: 0.080
  shoulder_length_in: 6.0     # req 2.5.3: >= 0.5 body diameter (3.0" here)

# --- Body sections ----------------------------------------------------------
#  Defined in the worksheet.  The avionics bay is a region INSIDE the payload
#  airframe (its AV Bay row), not a separate tube.

# --- Transitions ------------------------------------------------------------
#  Length, mass and position come from the worksheet's Boattail section.
transitions:
  - name: "Boattail"
    fore_diameter_in: 6.00
    aft_diameter_in: 3.20     # clears a 75 mm motor retainer
    shape: conical
    wall_thickness_in: 0.080

# --- Fins -------------------------------------------------------------------
#  Mass comes from the worksheet's `fins` row.
fins:
  count: 3
  root_chord_in: 13.0
  tip_chord_in: 6.00
  sweep_in: 7.00              # axial sweep distance of the leading edge
  height_in: 9.00             # semi-span; sized for >= 2.0 cal (req 2.11)
  thickness_in: 0.1875        # 3/16" G10
  cant_deg: 0.0
  offset_from_aft_in: 0.0     # trailing edge flush with the airframe aft end

# --- Rail buttons -----------------------------------------------------------
rail_guide:
  type: rail_button
  rail_size_in: 1.5           # 1515 rail

# --- Motor ------------------------------------------------------------------
#  `search` is matched against the OpenRocket thrust-curve database (1088 motor
#  sets ship inside the .jar).  Run `python scripts/list_motors.py L` to browse.
#  The framework models the motor PLUGGED regardless (req 3.1.3).
motor:
  search: "L1520T"            # AeroTech L1520T, on the NASA-supported list (2.7)
  manufacturer: "AeroTech"
  mount_inner_diameter_in: 2.953   # 75 mm
  mount_length_in: 24.0
  overhang_in: 0.25
  ignition_delay_s: 0.0

# --- Recovery ---------------------------------------------------------------
#  Two-stage per req 3.1.  Drogue at apogee, main low, motor ejection banned
#  (3.1.3) so both events are altimeter-fired.  Masses and positions come from
#  the worksheet's main, drogue and shock_cord rows.
recovery:
  drogue:
    name: "Drogue"
    diameter_in: 18.0
    cd: 1.55
    deploy_event: apogee
    deploy_delay_s: 1.0       # req 3.1.2: <= 2.0 s
  main:
    name: "Main"
    diameter_in: 96.0
    cd: 2.20
    deploy_event: altitude
    deploy_altitude_ft: 600.0 # req 3.1.1: >= 500 ft

# --- Tethered payload -------------------------------------------------------
#  The worksheet's `tethered` row: the payload rides inside the payload tube on
#  the pad and lands on its own tether.  It moves mass between landing pieces
#  without changing the flight.

# --- Independent sections at landing (req 3.2, KE <= 75 ft-lbf each) ---------
#  These must partition the landing mass.  `slisim.requirements` asserts that
#  sum(sections) + propellant + chutes + cord == gross lift-off mass, which is
#  exactly the bookkeeping the FRR asks for in section V.  Which joints
#  separate is a design decision, not something the worksheet can know.
landing_sections:
  - name: "Nose Cone"
    members: ["nose_cone"]
  - name: "Payload"
    members: ["Payload"]
  - name: "Payload Airframe"
    members: ["Payload Airframe"]
  - name: "Booster + Boattail"
    members: ["Booster Airframe", "fins", "Boattail"]

# --- Ballast (req 2.20.7) ---------------------------------------------------
#  2.20.7.4 requires EVERY requirement to be met at BOTH extremes, so the
#  framework runs min and max as two separate configurations.
ballast:
  min_lb: 0.0
  max_lb: 2.00               # must be <= 10% of un-ballasted on-pad mass
  location: "Payload Airframe"    # section name the ballast mass is added to

# --- Declared target (req 2.3, set at CDR) ----------------------------------
#  Declare the MEDIAN of the dispersed distribution, not a nominal run:
#      python scripts/run_montecarlo.py -n 1000
target_apogee_ft: 5130.0    # median of the 1000-case Monte Carlo, seed 12345
